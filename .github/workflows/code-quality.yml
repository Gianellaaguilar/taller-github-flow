name: Code Quality CI

on:
  pull_request:
    branches: [ main ]

jobs:
  analisis-estatico:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias (Flake8)
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          
      - name: Verificar Complejidad Ciclomática (V(G) <= 5)
        run: |
          # Flake8 evalúa la complejidad ciclomática sin fallar por espacios o saltos de línea
          flake8 . --max-complexity=5 --ignore=E501,W291,W292,W293 --statistics